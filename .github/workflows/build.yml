name: APK bauen

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Signaturschlüssel bereitstellen
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Warnung ohne Signaturschlüssel
        if: env.KEYSTORE_BASE64 == ''
        run: echo "::warning::Kein Signaturschlüssel hinterlegt. Die APK bekommt einen Zufallsschlüssel, Updates erfordern dann eine Neuinstallation."

      - name: APK bauen
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK benennen
        run: cp app/build/outputs/apk/release/app-release.apk "Kalender-Widgets-0.1.${{ github.run_number }}.apk"

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Kalender-Widgets 0.1.${{ github.run_number }}
          files: Kalender-Widgets-0.1.${{ github.run_number }}.apk
